syntax = "proto3";

package rentalaccommodation;

service RentalAccommodationService {
  rpc AddProperty (AddPropertyRequest) returns (AddPropertyResponse);
  rpc CreateUsers (stream UserProfile) returns (CreateUsersResponse);
  rpc UpdateProperty (UpdatePropertyRequest) returns (UpdatePropertyResponse);
  rpc ListProperties (ListPropertiesRequest) returns (stream Property);
}

message AddPropertyRequest {
  string property_name = 1;
  string location = 2;
  string property_type = 3;
  double price_per_night = 4;
  string status = 5;
}

message AddPropertyResponse {
  string property_id = 1;
  string message = 2;
}

message UserProfile {
  string user_id = 1;
  string full_name = 2;
  string email = 3;
  string role = 4;
}

message CreateUsersResponse {
  int32 users_created = 1;
  string message = 2;
}

message UpdatePropertyRequest {
  string property_id = 1;
  string property_name = 2;
  string location = 3;
  string property_type = 4;
  double price_per_night = 5;
  string status = 6;
}

message UpdatePropertyResponse {
  bool updated = 1;
  string message = 2;
  Property property = 3;
}

message ListPropertiesRequest {
  string location = 1;
  string property_type = 2;
}

message Property {
  string property_id = 1;
  string property_name = 2;
  string location = 3;
  string property_type = 4;
  double price_per_night = 5;
  string status = 6;
}
